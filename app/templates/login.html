{% extends "base.html" %}
{% block title %}Sign in · Price-Tracked Shopping List{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password <input type="password" name="password" autofocus autocomplete="current-password" required></label>
    <button class="btn btn-primary">Sign in</button>
  </form>
</section>
{% endblock %}
